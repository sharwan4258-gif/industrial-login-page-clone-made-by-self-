<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
  
    <link rel="stylesheet" href="style.css">


</head>

<body>
    

    <div class="portal-login">

        <header>
            <center>
                <div class="logo">

                    <img src="hindalco.png" alt="logo" width="150px" height="90px">

                </div>
            </center>

            <h3 class="heading">HINDALCO INDUSTRIES</h3>
            <p class="para"> employe registration portal Login</p>

            <hr>

            <div class="input">
                <p class="user-name">
                    • User name
                </p>
                <div class="sharwan">
                    <input type="text" placeholder="eg-sharwan kumar" class="sharwan">
                </div>

            </div>
            <!-- employe code section  -->
            <div class="input-2">
                <p class="code">
                    • employe id
                </p>

                <div class="number">
                    <input type="text" placeholder="eg-E101" class="number">
                </div>
            </div>

            <!-- Department section  -->

            <div class="department">
                <div class="dpt">
                    <p class="dpt">•Department</p>
                </div>

                <div class="input-3">
                    <input type="text" placeholder="eg-IT" class="input-3">
                </div>
            </div>
            <br>
            <div class="last">
                <div class="last-part">
                    <button type="submit" class="last-part">login to portal</button>
                </div>
            </div>



        </header>
    </div>



</body>


</html>
